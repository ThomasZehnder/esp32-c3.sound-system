<h2>Ultrasound Test</h2>

<p>Use GPIO0 hardware PWM to generate an ultrasonic test signal.</p>

<div class="ultrasound-form" data-ultrasound-form>
    <label class="ultrasound-field">
        <span>Frequency Hz</span>
        <input id="ultrasoundFrequency" type="number" min="5000" max="40000" step="100" value="8000">
    </label>

    <label class="ultrasound-field">
        <span>Random min Hz</span>
        <input id="ultrasoundMinFrequency" type="number" min="5000" max="40000" step="100" value="8000">
    </label>

    <label class="ultrasound-field">
        <span>Random max Hz</span>
        <input id="ultrasoundMaxFrequency" type="number" min="5000" max="40000" step="100" value="12000">
    </label>

    <label class="ultrasound-field">
        <span>Volume %</span>
        <input id="ultrasoundVolume" type="number" min="0" max="100" step="1" value="10">
    </label>

    <label class="ultrasound-field">
        <span>Duration ms</span>
        <input id="ultrasoundDuration" type="number" min="1" max="60000" step="100" value="1000">
    </label>
</div>

<div class="ultrasound-actions">
    <button type="button" id="ultrasoundStartButton">Start ultrasound</button>
    <button type="button" id="ultrasoundRandomStartButton">Start random ultrasound</button>
    <button type="button" id="ultrasoundStopButton">Stop ultrasound</button>
    <button type="button" id="ultrasoundRefreshButton">Refresh status</button>
</div>

<div class="ultrasound-actions">
    <button type="button" class="ultrasoundPresetButton" data-ultrasound-frequency="4000">Start 4000 Hz</button>
    <button type="button" class="ultrasoundPresetButton" data-ultrasound-frequency="12000">Start 12000 Hz</button>
    <button type="button" class="ultrasoundPresetButton" data-ultrasound-frequency="24000">Start 24000 Hz</button>
    <button type="button" class="ultrasoundPresetButton" data-ultrasound-frequency="36000">Start 36000 Hz</button>
</div>

<p>Random mode changes to a new random frequency every 200 ms within the configured min/max range.</p>
<p>The fixed-frequency buttons use the configured volume and duration.</p>

<pre id="ultrasoundStatus">Ultrasound idle.</pre>
